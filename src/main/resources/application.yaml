spring:
  application:
    name: ecom-order-service

server:
  port: 8080

logging:
  level:
    org:
      codewithNishu:
        ecom_order_service:
             client:        DEBUG
    com:
      netflix:
        discovery: DEBUG
eureka:
 client:
   register-with-eureka: true
   fetch-registry: true
   registry-fetch-interval-seconds: 30
   
   service-url:
     defaultZone: http://localhost:8761/eureka
 instance:
    lease-renewal-interval-in-seconds: 5

resilience4j:
  ratelimiter:
    instances:
      inventoryService:
        limit-for-period: 2 # 2 requests per 10 seconds meaning of these  configurations
        limit-refresh-period: 10s # 10 seconds to refresh limits
        timeout-duration: 0s # if the request is rejected how much time do i wait for particuler connection , using 0 we are immediatly reject the extra requests  